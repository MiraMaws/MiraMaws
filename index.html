<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>White Wings</title>
<style>
  :root { --g:#c9a227; --ink:#ece6dc; --d:#8a8490; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:#07070b; color:var(--ink); font-family:system-ui,sans-serif; }
  canvas { position:fixed; inset:0; }
  #ui { position:relative; z-index:2; max-width:420px; margin:0 auto; padding:8vh 1.2rem 3rem; text-align:center; }
  h1 { font-weight:500; letter-spacing:.42em; font-size:.78rem; color:var(--g); }
  p.hint { color:var(--d); font-size:.92rem; margin:1rem 0 1.4rem; line-height:1.45; }
  .ring { width:220px; height:220px; margin:0 auto 1.2rem; border-radius:50%;
    border:10px solid #2a1e10; box-shadow:0 0 0 1px var(--g), 0 0 40px #c9a22733;
    position:relative; animation:spin 48s linear infinite; }
  .earth { position:absolute; inset:12%; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #8ec8ff, #1a4a8a 50%, #0a2040); }
  @keyframes spin { to { transform:rotate(360deg); } }
  #orb { width:96px; height:96px; margin:0 auto .8rem; border-radius:50%; border:0; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #f2e2a8, #8a6a20 55%, #1a1408);
    box-shadow:0 0 28px #c9a22766; color:#1a1408; font-weight:700; letter-spacing:.1em; }
  #orb:active { transform:scale(.94); }
  .row { display:flex; gap:8px; margin:1rem 0; }
  .stat { flex:1; background:#101016; border-radius:10px; padding:.5rem; }
  .stat b { display:block; font-size:1.15rem; }
  .stat span { font-size:.65rem; color:var(--d); text-transform:uppercase; }
  .bar { height:6px; background:#111; border-radius:6px; overflow:hidden; margin:.4rem 0 1rem; }
  .bar i { display:block; height:100%; width:0; background:var(--g); }
  button.buy { width:100%; text-align:left; margin:.3rem 0; padding:.7rem .85rem; border-radius:12px;
    border:1px solid #2a2430; background:#101016; color:var(--ink); font:inherit; cursor:pointer; }
  button.buy.go { border-color:var(--g); }
  button.buy:disabled { opacity:.35; }
  button.buy small { display:block; color:var(--d); }
  #say { min-height:2.4em; color:#b8b0c0; font-size:.88rem; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="ui">
  <h1>WHITE WINGS</h1>
  <p class="hint">Click the gold circle. When a button lights up, press it. That’s the whole game.</p>
  <div class="ring"><div class="earth"></div></div>
  <button id="orb" type="button">CLICK</button>
  <div class="row">
    <div class="stat"><span>Light</span><b id="lum">0</b></div>
    <div class="stat"><span>Each second</span><b id="lps">0</b></div>
    <div class="stat"><span>Level</span><b id="lvl">1</b></div>
  </div>
  <div class="bar"><i id="xp"></i></div>
  <p id="say">A quiet start.</p>
  <button class="buy" id="bAuto" type="button"><b>Collect while away</b><small>Costs 15</small></button>
  <button class="buy" id="bClick" type="button"><b>Stronger click</b><small>Costs 20</small></button>
</div>
<script>
const c=document.getElementById('stars'),x=c.getContext('2d');
function size(){ c.width=innerWidth; c.height=innerHeight; }
addEventListener('resize',size); size();
const stars=[...Array(120)].map(()=>({x:Math.random(),y:Math.random(),z:Math.random()*1.4+.2}));
(function draw(){
  x.fillStyle='#07070b'; x.fillRect(0,0,c.width,c.height);
  stars.forEach(s=>{ s.y+=s.z*.00015; if(s.y>1)s.y=0;
    x.fillStyle=`rgba(232,228,220,${.2+s.z*.45})`;
    x.fillRect(s.x*c.width,s.y*c.height,s.z,s.z);
  });
  requestAnimationFrame(draw);
})();
function load(){ try{return JSON.parse(localStorage.getItem('ww_public')||'');}catch(e){return null;} }
const s=Object.assign({lumen:0,clicks:0,xp:0,level:1,auto:0,click:0,t:Date.now()},load()||{});
function save(){ s.t=Date.now(); localStorage.setItem('ww_public',JSON.stringify(s)); }
function cost(b,lv){ return Math.max(1,Math.floor(b*Math.pow(1.18,lv))); }
function pow(){ return 1+s.click; }
function lps(){ return s.auto*0.4; }
function need(){ return 20+s.level*15; }
function fmt(n){ return n>=1000?n.toFixed(1):Math.floor(n*10)/10; }
function say(t){ document.getElementById('say').textContent=t; }
function render(){
  document.getElementById('lum').textContent=fmt(s.lumen);
  document.getElementById('lps').textContent=fmt(lps());
  document.getElementById('lvl').textContent=s.level;
  document.getElementById('xp').style.width=Math.min(100,s.xp/need()*100)+'%';
  const a=document.getElementById('bAuto'), k=document.getElementById('bClick');
  a.disabled=s.lumen<cost(15,s.auto); k.disabled=s.lumen<cost(20,s.click);
  a.classList.toggle('go',!a.disabled); k.classList.toggle('go',!k.disabled);
  a.querySelector('small').textContent='Costs '+cost(15,s.auto);
  k.querySelector('small').textContent='Costs '+cost(20,s.click);
}
function addXp(n){ s.xp+=n; while(s.xp>=need()){ s.xp-=need(); s.level++; say('Level '+s.level); } }
document.getElementById('orb').onclick=()=>{ s.lumen+=pow(); s.clicks++; addXp(1); save(); render(); };
document.getElementById('bAuto').onclick=()=>{ const c=cost(15,s.auto); if(s.lumen<c)return; s.lumen-=c; s.auto++; save(); render(); };
document.getElementById('bClick').onclick=()=>{ const c=cost(20,s.click); if(s.lumen<c)return; s.lumen-=c; s.click++; save(); render(); };
(function(){ const dt=Math.min(8*3600,(Date.now()-(s.t||Date.now()))/1000); const g=lps()*dt; if(g>1){ s.lumen+=g; say('While away +'+fmt(g)); }})();
setInterval(()=>{ s.lumen+=lps(); if(lps()>0) addXp(0.04); save(); render(); },1000);
render();
</script>
</body>
</html>
