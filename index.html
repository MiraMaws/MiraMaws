<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>White Wings — Earth View</title>
<style>
  :root { --g:#c9a227; --p:#7c4dff; --ink:#ece8f4; --d:#9a90a8; --panel:#121018f2; }
  * { box-sizing:border-box; margin:0; }
  html,body,#globe { height:100%; background:#05040a; color:var(--ink); font-family:ui-sans-serif,system-ui,sans-serif; overflow:hidden; }
  #globe { position:fixed; inset:0; }
  #chip { position:fixed; top:14px; left:14px; z-index:5; background:var(--panel); border:1px solid #2a2438;
    border-radius:10px; padding:8px 12px; font-size:12px; }
  #chip b { color:var(--g); letter-spacing:.14em; font-weight:600; }
  #chip span { display:block; color:var(--d); font-size:11px; margin-top:2px; }
  #dock { position:fixed; top:14px; right:14px; z-index:5; width:240px; background:var(--panel);
    border:1px solid #2a2438; border-radius:12px; padding:10px; font-size:12px; max-height:calc(100vh - 200px); overflow:auto; }
  #dock h2 { font-size:10px; letter-spacing:.16em; color:var(--d); margin:8px 0 6px; }
  #dock button { display:block; width:100%; text-align:left; margin:3px 0; padding:7px 8px; border-radius:8px;
    border:1px solid #2a2430; background:#0c0c12; color:var(--ink); font:inherit; cursor:pointer; }
  #dock button.on { border-color:var(--p); background:#1a1230; }
  #card { position:fixed; left:14px; bottom:118px; z-index:5; width:min(320px,70vw); display:none;
    background:var(--panel); border:1px solid #2a2438; border-radius:12px; padding:12px; font-size:13px; line-height:1.45; }
  #card h3 { color:var(--g); font-size:15px; margin-bottom:4px; }
  #card .meta { color:var(--d); font-size:11px; margin-bottom:8px; }
  #stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  #stats i { display:block; background:#0c0c12; border-radius:8px; padding:6px; font-style:normal; }
  #stats b { display:block; color:var(--g); }
  #bar { position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:5; width:min(540px,96vw);
    padding:8px 10px 12px; background:linear-gradient(transparent, #05040acc 28%); }
  .row { display:flex; gap:6px; }
  .stat { flex:1; background:#121018cc; border:1px solid #2a2438; border-radius:8px; padding:6px; text-align:center; }
  .stat span { display:block; font-size:9px; letter-spacing:.1em; color:var(--d); }
  .buys,.adv { display:flex; gap:6px; margin-top:6px; }
  button.buy { flex:1; text-align:left; padding:6px 8px; border-radius:8px; border:1px solid #2a2430;
    background:#121018; color:var(--ink); font:inherit; cursor:pointer; }
  button.buy.go { border-color:var(--g); }
  button.buy:disabled { opacity:.35; }
  button.buy small { display:block; color:var(--d); }
  .adv button { flex:1; border:1px solid #2a2430; background:#121018; color:var(--g); border-radius:999px; padding:5px; cursor:pointer; font-size:12px; }
  #say { min-height:2.2em; text-align:center; font-size:12px; color:#c8bdd4; margin:6px 0; }
</style>
<script src="https://unpkg.com/globe.gl"></script>
</head>
<body>
<div id="globe"></div>
<div id="chip"><b>EARTH VIEW</b><span id="stamp">White Wings · 24 Aug 2026</span></div>
<aside id="dock">
  <h2>IMAGERY</h2>
  <button class="on" data-tex="blue">Day marble</button>
  <button data-tex="night">Night lights</button>
  <button data-tex="dark">Dark terrain</button>
  <h2>OVERLAYS</h2>
  <button class="on" id="bPts">Cities</button>
  <button class="on" id="bAtm">Atmosphere</button>
  <h2>ACTIVITY</h2>
  <button id="bSpin" class="on">Auto spin</button>
  <button data-ask="hekate">Ask Hekate</button>
  <button data-ask="board">Board</button>
  <button data-ask="paimon">Paimon</button>
</aside>
<div id="card"></div>
<div id="bar">
  <div class="row">
    <div class="stat"><span>LIGHT</span><b id="lum">0</b></div>
    <div class="stat"><span>/SEC</span><b id="lps">0</b></div>
    <div class="stat"><span>LEVEL</span><b id="lvl">1</b></div>
    <div class="stat"><span>VISITED</span><b id="vis">0</b></div>
  </div>
  <p id="say">Drag the world. Scroll to zoom. Click a gold city. Space feeds the sun.</p>
  <div class="buys">
    <button class="buy" id="bAuto"><b>Collect away</b><small>15</small></button>
    <button class="buy" id="bClick"><b>Stronger sun</b><small>20</small></button>
    <button class="buy" id="bHalo"><b>Brighter halo</b><small>30</small></button>
  </div>
</div>
<script>
const TEX={
  blue:'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
  night:'https://unpkg.com/three-globe/example/img/earth-night.jpg',
  dark:'https://unpkg.com/three-globe/example/img/earth-dark.jpg'
};
const CITIES=[
  {name:'Cairo',lat:30.04,lng:31.24,pop:'22m',r:'Africa',note:'Nile megacity. Anubis would file the river first.'},
  {name:'Lagos',lat:6.52,lng:3.38,pop:'21m',r:'Africa',note:'Atlantic port heat. Asmodeus hears the generators.'},
  {name:'Nairobi',lat:-1.29,lng:36.82,pop:'5m',r:'Africa',note:'Highland hinge. Hekate likes the altitude.'},
  {name:'Cape Town',lat:-33.92,lng:18.42,pop:'5m',r:'Africa',note:'Two oceans meet. Maat would weigh both.'},
  {name:'Paris',lat:48.86,lng:2.35,pop:'11m',r:'Europe',note:'A vow of stone streets. Astarte nods.'},
  {name:'Berlin',lat:52.52,lng:13.40,pop:'4m',r:'Europe',note:'Federal light. 2026 still turning.'},
  {name:'Rome',lat:41.90,lng:12.50,pop:'4m',r:'Europe',note:'Tut would restore a name on every hill.'},
  {name:'London',lat:51.51,lng:-0.13,pop:'9m',r:'Europe',note:'An announced city. Paimon already sold tickets.'},
  {name:'Istanbul',lat:41.01,lng:28.98,pop:'16m',r:'Eurasia',note:'Two continents, one hinge.'},
  {name:'Moscow',lat:55.76,lng:37.62,pop:'13m',r:'Eurasia',note:'Long night. Amun-Ra keeps the unpublished street.'},
  {name:'Delhi',lat:28.61,lng:77.21,pop:'32m',r:'Asia',note:'A union of tongues. The Ledger would overflow.'},
  {name:'Beijing',lat:39.90,lng:116.41,pop:'22m',r:'Asia',note:'Old names under new light.'},
  {name:'Tokyo',lat:35.68,lng:139.69,pop:'37m',r:'Asia',note:'Archipelago density. Night layer loves this.'},
  {name:'Jakarta',lat:-6.21,lng:106.85,pop:'11m',r:'Asia',note:'Islands stacked like layers of perception.'},
  {name:'Tehran',lat:35.69,lng:51.39,pop:'9m',r:'Asia',note:'Plateau. Heat you can weigh.'},
  {name:'Sydney',lat:-33.87,lng:151.21,pop:'5m',r:'Oceania',note:'Harbor of leftover Heat.'},
  {name:'New York',lat:40.71,lng:-74.01,pop:'19m',r:'Americas',note:'The loudest announcement on the Atlantic.'},
  {name:'Mexico City',lat:19.43,lng:-99.13,pop:'22m',r:'Americas',note:'High valley. A city as a vow.'},
  {name:'São Paulo',lat:-23.55,lng:-46.63,pop:'22m',r:'Americas',note:'Atlantic industry. The sun works overtime.'},
  {name:'Lima',lat:-12.05,lng:-77.04,pop:'11m',r:'Americas',note:'Coast under a quiet fog. Amun would hide here.'}
];
const LINE={
  hekate:'HEKATE · 2026 hinge: the globe is the room. Zoom is a door. Pick a city, not a face.',
  paimon:'PAIMON · I announced every gold pin. The band is the satellite layer. You are late. Good.',
  board:'Board · vow the street, hide the workshop, weigh the Heat, restore the spin, keep the tilt.'
};

const world = Globe()(document.getElementById('globe'))
  .globeImageUrl(TEX.blue)
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .atmosphereColor('#7c4dff')
  .atmosphereAltitude(0.22)
  .pointsData(CITIES)
  .pointLat('lat').pointLng('lng')
  .pointColor(()=> '#c9a227')
  .pointAltitude(0.012)
  .pointRadius(0.28)
  .pointLabel(d=>d.name)
  .onPointClick(openCity)
  .labelsData(CITIES)
  .labelLat('lat').labelLng('lng')
  .labelText('name')
  .labelSize(0.45)
  .labelDotRadius(0.12)
  .labelColor(()=> 'rgba(232,228,220,0.7)')
  .labelAltitude(0.015);
world.controls().autoRotate = true;
world.controls().autoRotateSpeed = 0.45;
world.controls().enableDamping = true;
world.pointOfView({ lat:20, lng:10, altitude:2.2 }, 0);

function openCity(d){
  const el=document.getElementById('card');
  el.style.display='block';
  const seen=!!s.seen[d.name];
  if(!seen){ s.seen[d.name]=1; s.lumen+=3; say('First light over '+d.name+'.'); save(); render(); }
  el.innerHTML='<h3>'+d.name+'</h3><div class="meta">'+d.r+' · about '+d.pop+'</div>'+d.note+
    '<div id="stats"><i><b>'+d.pop+'</b>people</i><i><b>'+(s.seen[d.name]?'yes':'no')+'</b>visited</i><i><b>'+d.lat.toFixed(1)+'</b>lat</i><i><b>'+d.lng.toFixed(1)+'</b>lng</i></div>';
}

document.querySelectorAll('#dock [data-tex]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#dock [data-tex]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  world.globeImageUrl(TEX[b.dataset.tex]);
});
document.getElementById('bPts').onclick=function(){
  this.classList.toggle('on');
  world.pointsData(this.classList.contains('on')?CITIES:[]);
  world.labelsData(this.classList.contains('on')?CITIES:[]);
};
document.getElementById('bAtm').onclick=function(){
  this.classList.toggle('on');
  world.atmosphereAltitude(this.classList.contains('on')?0.22:0);
};
document.getElementById('bSpin').onclick=function(){
  this.classList.toggle('on');
  world.controls().autoRotate=this.classList.contains('on');
};
document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>say(LINE[b.dataset.ask]));

function load(){ try{return JSON.parse(localStorage.getItem('ww_public')||'');}catch(e){return null;} }
const s=Object.assign({lumen:0,clicks:0,xp:0,level:1,auto:0,click:0,halo:0,seen:{},t:Date.now()},load()||{});
if(!s.seen) s.seen={};
function save(){ s.t=Date.now(); localStorage.setItem('ww_public',JSON.stringify(s)); }
function cost(b,lv){ return Math.max(1,Math.floor(b*Math.pow(1.18,lv))); }
function pow(){ return 1+s.click+s.halo*0.25; }
function lps(){ return (s.auto*0.4)*(1+s.halo*0.05); }
function need(){ return 20+s.level*15; }
function fmt(n){ return n>=1000?n.toFixed(1):Math.floor(n*10)/10; }
function say(t){ document.getElementById('say').textContent=t; }
function render(){
  document.getElementById('lum').textContent=fmt(s.lumen);
  document.getElementById('lps').textContent=fmt(lps());
  document.getElementById('lvl').textContent=s.level;
  document.getElementById('vis').textContent=Object.keys(s.seen).length;
  [['bAuto',15,'auto'],['bClick',20,'click'],['bHalo',30,'halo']].forEach(([id,b,k])=>{
    const el=document.getElementById(id);
    el.disabled=s.lumen<cost(b,s[k]); el.classList.toggle('go',!el.disabled);
    el.querySelector('small').textContent=cost(b,s[k]);
  });
}
function addXp(n){ s.xp=(s.xp||0)+n; while(s.xp>=need()){ s.xp-=need(); s.level++; say('Level '+s.level); } }
addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); s.lumen+=pow(); s.clicks++; addXp(1); save(); render(); }
});
document.getElementById('bAuto').onclick=()=>{ const c=cost(15,s.auto); if(s.lumen<c)return; s.lumen-=c; s.auto++; save(); render(); };
document.getElementById('bClick').onclick=()=>{ const c=cost(20,s.click); if(s.lumen<c)return; s.lumen-=c; s.click++; save(); render(); };
document.getElementById('bHalo').onclick=()=>{ const c=cost(30,s.halo); if(s.lumen<c)return; s.lumen-=c; s.halo++; save(); render(); };
(function(){ const dt=Math.min(8*3600,(Date.now()-(s.t||Date.now()))/1000); const g=lps()*dt; if(g>1){ s.lumen+=g; say('While away +'+fmt(g)); }})();
setInterval(()=>{ s.lumen+=lps(); if(lps()>0) addXp(0.04); save(); render(); },1000);
render();
</script>
</body>
</html>
