<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>White Wings</title>
<style>
  :root { --g:#c9a227; --v:#5a3a78; --ink:#ece6dc; --d:#8a8490; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:#050508; color:var(--ink); font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; }
  #ui { position:relative; z-index:2; height:100%; display:grid; grid-template-rows:auto 1fr auto; }
  header { text-align:center; padding:1.1rem 1rem .2rem; }
  h1 { font-weight:500; letter-spacing:.46em; font-size:.76rem; color:var(--g); }
  .hint { color:var(--d); font-size:.84rem; margin-top:.4rem; }
  #stage { position:relative; }
  #world { position:absolute; left:50%; top:48%; width:min(58vmin,380px); height:min(58vmin,380px);
    transform:translate(-50%,-50%); }
  .halo { position:absolute; inset:-8%; border-radius:50%;
    background:radial-gradient(circle, transparent 52%, #c9a22722 58%, transparent 72%);
    animation:pulse 6s ease-in-out infinite; pointer-events:none; }
  .ringline { position:absolute; inset:6%; border-radius:50%; border:1px solid #c9a22733; pointer-events:none; }
  .ringline.inner { inset:18%; border-color:#5a3a7844; }
  .orbit { position:absolute; inset:0; border-radius:50%; animation:spin 46s linear infinite; }
  .orbit.r { animation-duration:68s; animation-direction:reverse; }
  .god { position:absolute; width:40px; height:40px; margin:-20px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a2438, #0c0c12);
    border:1px solid var(--g); color:var(--g); font-size:8px; letter-spacing:.05em;
    display:grid; place-items:center; cursor:pointer; text-align:center; line-height:1.05;
    box-shadow:0 0 10px #c9a22744, inset 0 0 8px #0008; }
  .god:hover { transform:scale(1.1); box-shadow:0 0 16px #c9a22788; }
  .earth { position:absolute; inset:24%; border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 32% 26%, #b8e0ff 0%, #3a7ab8 28%, #143868 58%, #071018 100%);
    box-shadow: inset -22px -16px 36px #000c, inset 10px 8px 18px #8ec8ff33, 0 0 48px #2468aa66; }
  .land { position:absolute; inset:-28%; opacity:.75;
    background:
      radial-gradient(ellipse 18% 12% at 30% 40%, #2f7a4acc 0%, transparent 70%),
      radial-gradient(ellipse 22% 14% at 62% 55%, #1f5a38bb 0%, transparent 70%),
      radial-gradient(ellipse 14% 10% at 48% 28%, #3a8a52aa 0%, transparent 70%);
    animation:drift 36s linear infinite; }
  .cloud { position:absolute; inset:0;
    background:radial-gradient(circle at 24% 28%, #fff6, transparent 18%),
               radial-gradient(circle at 72% 60%, #fff4, transparent 16%);
    animation:drift 48s linear infinite reverse; }
  .shade { position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:linear-gradient(118deg, #fff2 0%, transparent 36%, #0000 48%, #0009 78%, #000c 100%); }
  .atmo { position:absolute; inset:-3%; border-radius:50%; pointer-events:none;
    box-shadow:inset 0 0 18px #7ec8ff55, 0 0 22px #4aa0ff44; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes drift { to { transform:rotate(12deg) translateX(-10%); } }
  .moon { position:absolute; width:18px; height:18px; margin:-9px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f0ead8, #8a8490);
    box-shadow:0 0 10px #fff4; left:50%; top:50%; animation:lun 18s linear infinite; }
  @keyframes lun { from { transform:rotate(0) translateX(min(34vmin,220px)); } to { transform:rotate(360deg) translateX(min(34vmin,220px)); } }
  #orb { position:absolute; left:50%; top:48%; width:72px; height:72px; transform:translate(-50%,-50%);
    border:0; border-radius:50%; cursor:pointer; z-index:3;
    background:radial-gradient(circle at 32% 28%, #fff4c8, #e0b84a 38%, #8a6a20 70%, #1a1408);
    color:#1a1408; font-weight:700; letter-spacing:.08em; font-size:.72rem;
    box-shadow:0 0 28px #c9a22799, inset 0 -6px 10px #0004; }
  #orb:active { transform:translate(-50%,-50%) scale(.94); }
  footer { padding:.5rem 1rem 1rem; max-width:580px; margin:0 auto; width:100%; }
  .row { display:flex; gap:8px; }
  .stat { flex:1; background:#101016cc; border:1px solid #1c1824; border-radius:10px; padding:.42rem; text-align:center; }
  .stat b { display:block; font-size:1.02rem; }
  .stat span { font-size:.6rem; color:var(--d); letter-spacing:.08em; text-transform:uppercase; }
  .bar { height:5px; background:#111; border-radius:6px; overflow:hidden; margin:.42rem 0 .5rem; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#7a5a20,var(--g)); }
  .buys { display:flex; gap:8px; }
  button.buy { flex:1; text-align:left; padding:.5rem .65rem; border-radius:10px;
    border:1px solid #2a2430; background:#101016cc; color:var(--ink); font:inherit; cursor:pointer; }
  button.buy.go { border-color:var(--g); box-shadow:0 0 0 1px #c9a22755; }
  button.buy:disabled { opacity:.35; }
  button.buy small { display:block; color:var(--d); }
  #say { min-height:3.3em; color:#c4b8c8; font-size:.84rem; margin:.48rem 0; line-height:1.4; text-align:center; }
  .adv { display:flex; gap:6px; }
  .adv button { flex:1; border:1px solid #2a2430; background:#0c0c12cc; color:var(--g);
    border-radius:999px; padding:.38rem .5rem; cursor:pointer; font-size:.76rem; letter-spacing:.04em; }
  .spark { position:fixed; width:4px; height:4px; border-radius:50%; background:var(--g); pointer-events:none; z-index:5; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="ui">
  <header>
    <h1>WHITE WINGS</h1>
    <p class="hint">Click the sun. Tap a name in orbit. Buy when a button gilds.</p>
  </header>
  <div id="stage">
    <div id="world">
      <div class="halo"></div>
      <div class="ringline"></div>
      <div class="ringline inner"></div>
      <div class="orbit" id="o1"></div>
      <div class="orbit r" id="o2"></div>
      <div class="earth">
        <div class="land"></div>
        <div class="cloud"></div>
        <div class="shade"></div>
        <div class="atmo"></div>
      </div>
      <div class="moon" title="watch"></div>
    </div>
    <button id="orb" type="button">CLICK</button>
  </div>
  <footer>
    <div class="row">
      <div class="stat"><span>Light</span><b id="lum">0</b></div>
      <div class="stat"><span>/ sec</span><b id="lps">0</b></div>
      <div class="stat"><span>Level</span><b id="lvl">1</b></div>
    </div>
    <div class="bar"><i id="xp"></i></div>
    <p id="say">Eight walk the rim. The planet does not ask their names.</p>
    <div class="buys">
      <button class="buy" id="bAuto" type="button"><b>Collect away</b><small>15</small></button>
      <button class="buy" id="bClick" type="button"><b>Stronger click</b><small>20</small></button>
      <button class="buy" id="bHalo" type="button"><b>Brighter halo</b><small>30</small></button>
    </div>
    <div class="adv">
      <button type="button" data-ask="hekate">Ask Hekate</button>
      <button type="button" data-ask="board">Board</button>
      <button type="button" data-ask="paimon">Paimon</button>
      <button type="button" id="bDay">Today</button>
    </div>
  </footer>
</div>
<script>
const GODS=[
  {id:'astarte', n:'ASTARTE', orbit:1, a:0},
  {id:'asmodeus', n:'HEAT', orbit:1, a:90},
  {id:'amun', n:'AMUN', orbit:1, a:180},
  {id:'paimon', n:'PAIMON', orbit:1, a:270},
  {id:'anubis', n:'ANUBIS', orbit:2, a:45},
  {id:'tut', n:'TUT', orbit:2, a:135},
  {id:'maat', n:'MAAT', orbit:2, a:225},
  {id:'hekate', n:'HEKATE', orbit:2, a:315}
];
const ASK={
  astarte:'A city is a vow with streets.',
  asmodeus:'Name the leftover heat.',
  amun:'The brightest move is unpublished.',
  anubis:'What died — did we weigh it?',
  tut:'Restore one buried name.',
  maat:'Keep a slight tilt.',
  hekate:'Pick the hinge, not a face.',
  paimon:'I announced it. The band is lost.'
};
GODS.forEach(g=>{
  const host=document.getElementById(g.orbit===1?'o1':'o2');
  const d=document.createElement('button');
  d.className='god'; d.type='button'; d.textContent=g.n;
  const r=g.orbit===1?48:36, rad=g.a*Math.PI/180;
  d.style.left=(50+r*Math.cos(rad))+'%';
  d.style.top=(50+r*Math.sin(rad))+'%';
  d.onclick=()=>useGod(g.id);
  host.appendChild(d);
});
function say(t){ document.getElementById('say').textContent=t; }
function spark(e){
  const s=document.createElement('i'); s.className='spark';
  s.style.left=(e.clientX-2)+'px'; s.style.top=(e.clientY-2)+'px';
  document.body.appendChild(s);
  s.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-28px)',opacity:0}],{duration:420}).onfinish=()=>s.remove();
}
async function wikiDay(){
  const n=new Date();
  const r=await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${n.getUTCMonth()+1}/${n.getUTCDate()}`);
  const j=await r.json();
  const ev=(j.events||[])[Math.floor(Math.random()*(j.events||[]).length)];
  return ev ? ev.year+': '+(ev.text||'').slice(0,170) : 'The archive is quiet.';
}
async function wikiRand(){
  const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary');
  const j=await r.json();
  return (j.title||'?')+' — '+String(j.extract||'').slice(0,150);
}
async function weather(){
  const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=30.04&longitude=31.24&current=temperature_2m');
  const j=await r.json();
  return 'Heat at the old river: '+(j.current&&j.current.temperature_2m)+'°.';
}
async function featured(){
  const d=new Date().toISOString().slice(0,10).replace(/-/g,'/');
  const r=await fetch('https://en.wikipedia.org/api/rest_v1/feed/featured/'+d);
  const j=await r.json();
  const t=(j.tfa&&((j.tfa.titles&&j.tfa.titles.normalized)||j.tfa.title))||'Today';
  return t+' — '+String(j.tfa&&j.tfa.extract||'').slice(0,140);
}
async function useGod(id){
  say((id.toUpperCase())+' listens…');
  try{
    let line=ASK[id];
    if(id==='anubis') line='ANUBIS files: '+(await featured());
    else if(id==='tut') line='TUT restores: '+(await wikiDay());
    else if(id==='amun') line='AMUN-RA hides in: '+(await wikiRand());
    else if(id==='asmodeus') line='ASMODEUS: '+(await weather());
    else if(id==='astarte') line='ASTARTE: '+(await wikiRand());
    else if(id==='maat') line='MAAT weighs: '+(await wikiDay());
    else if(id==='hekate') line='HEKATE: '+(await wikiRand());
    else if(id==='paimon') line='PAIMON: '+(await featured());
    say(line);
  }catch(e){ say((ASK[id]||'The net blinked.')); }
}
document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{
  if(b.dataset.ask==='board'){
    say('Board — vow · heat · hide · weigh · restore · tilt. No one sits first.');
    return;
  }
  useGod(b.dataset.ask);
});
document.getElementById('bDay').onclick=()=>useGod('tut');
addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); document.getElementById('orb').click(); }
});

const c=document.getElementById('stars'),x=c.getContext('2d');
function size(){ c.width=innerWidth; c.height=innerHeight; }
addEventListener('resize',size); size();
const stars=[...Array(180)].map(()=>({x:Math.random(),y:Math.random(),z:Math.random()*1.5+.15}));
(function draw(){
  x.fillStyle='#050508'; x.fillRect(0,0,c.width,c.height);
  stars.forEach(s=>{ s.y+=s.z*.0001; if(s.y>1)s.y=0;
    x.fillStyle=`rgba(232,228,220,${.15+s.z*.5})`;
    x.fillRect(s.x*c.width,s.y*c.height,s.z,s.z);
  });
  requestAnimationFrame(draw);
})();

function load(){ try{return JSON.parse(localStorage.getItem('ww_public')||'');}catch(e){return null;} }
const s=Object.assign({lumen:0,clicks:0,xp:0,level:1,auto:0,click:0,halo:0,t:Date.now()},load()||{});
function save(){ s.t=Date.now(); localStorage.setItem('ww_public',JSON.stringify(s)); }
function cost(b,lv){ return Math.max(1,Math.floor(b*Math.pow(1.18,lv))); }
function pow(){ return 1+s.click+s.halo*0.25; }
function lps(){ return (s.auto*0.4)*(1+s.halo*0.05); }
function need(){ return 20+s.level*15; }
function fmt(n){ return n>=1000?n.toFixed(1):Math.floor(n*10)/10; }
function render(){
  document.getElementById('lum').textContent=fmt(s.lumen);
  document.getElementById('lps').textContent=fmt(lps());
  document.getElementById('lvl').textContent=s.level;
  document.getElementById('xp').style.width=Math.min(100,s.xp/need()*100)+'%';
  [['bAuto',15,'auto'],['bClick',20,'click'],['bHalo',30,'halo']].forEach(([id,b,k])=>{
    const el=document.getElementById(id);
    el.disabled=s.lumen<cost(b,s[k]);
    el.classList.toggle('go',!el.disabled);
    el.querySelector('small').textContent=cost(b,s[k]);
  });
}
function addXp(n){ s.xp+=n; while(s.xp>=need()){ s.xp-=need(); s.level++; say('Level '+s.level); } }
document.getElementById('orb').onclick=e=>{ spark(e); s.lumen+=pow(); s.clicks++; addXp(1); save(); render(); };
document.getElementById('bAuto').onclick=()=>{ const c=cost(15,s.auto); if(s.lumen<c)return; s.lumen-=c; s.auto++; save(); render(); };
document.getElementById('bClick').onclick=()=>{ const c=cost(20,s.click); if(s.lumen<c)return; s.lumen-=c; s.click++; save(); render(); };
document.getElementById('bHalo').onclick=()=>{ const c=cost(30,s.halo); if(s.lumen<c)return; s.lumen-=c; s.halo++; save(); render(); };
(function(){ const dt=Math.min(8*3600,(Date.now()-(s.t||Date.now()))/1000); const g=lps()*dt; if(g>1){ s.lumen+=g; say('While away +'+fmt(g)); }})();
setInterval(()=>{ s.lumen+=lps(); if(lps()>0) addXp(0.04); save(); render(); },1000);
render();
</script>
</body>
</html>
