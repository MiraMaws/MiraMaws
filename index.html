<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>White Wings</title>
<style>
  :root { --g:#c9a227; --p:#6b3fa0; --p2:#2a1840; --ink:#f0eaf6; --d:#9a8eaa; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:#12081c; color:var(--ink); font-family:ui-sans-serif,system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; z-index:0; }
  #ui { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; }
  header { flex:0 0 auto; text-align:center; padding:1rem 1rem 0; }
  h1 { font-weight:600; letter-spacing:.4em; font-size:.75rem; color:var(--g); }
  .hint { color:var(--d); font-size:.8rem; margin-top:.35rem; }
  #stage { flex:1 1 auto; position:relative; min-height:0; }
  #world { position:absolute; left:50%; top:50%; width:min(52vmin,320px); height:min(52vmin,320px);
    transform:translate(-50%,-50%); }
  .halo { position:absolute; inset:-10%; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, transparent 50%, #6b3fa033 58%, transparent 74%);
    animation:pulse 7s ease-in-out infinite; }
  .ringline { position:absolute; inset:4%; border-radius:50%; border:1px solid #c9a22744; pointer-events:none; }
  .ringline.inner { inset:16%; border-color:#6b3fa055; }
  .orbit { position:absolute; inset:0; border-radius:50%; animation:spin 48s linear infinite; }
  .orbit.r { animation-duration:70s; animation-direction:reverse; }
  .god { position:absolute; width:42px; height:42px; margin:-21px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #3a2458, #160816);
    border:1px solid var(--g); color:var(--g); font-size:7.5px; letter-spacing:.04em;
    display:grid; place-items:center; cursor:pointer; text-align:center; line-height:1.05;
    box-shadow:0 0 12px #6b3fa066; }
  .god:hover { transform:scale(1.12); z-index:5; }
  .earth { position:absolute; inset:23%; border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 32% 26%, #c5e4ff, #4a88c8 30%, #1a3a68 60%, #0a1018);
    box-shadow:inset -20px -14px 32px #000a, 0 0 40px #4a2a7a66; }
  .land { position:absolute; inset:-26%;
    background:
      radial-gradient(ellipse 20% 13% at 28% 38%, #2f7a4acc 0 70%, transparent 71%),
      radial-gradient(ellipse 24% 15% at 64% 54%, #1f5a38bb 0 70%, transparent 71%),
      radial-gradient(ellipse 14% 10% at 48% 26%, #3a8a52aa 0 70%, transparent 71%);
    animation:drift 40s linear infinite; }
  .cloud { position:absolute; inset:0;
    background:radial-gradient(circle at 24% 28%, #fff5, transparent 18%),
               radial-gradient(circle at 70% 62%, #fff3, transparent 16%);
    animation:drift 52s linear infinite reverse; }
  .shade { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(120deg, #fff2 0%, transparent 34%, #0008 78%, #000b 100%); }
  .atmo { position:absolute; inset:-4%; border-radius:50%; pointer-events:none;
    box-shadow:inset 0 0 16px #9ad0ff55, 0 0 20px #6b3fa044; }
  .moon { position:absolute; width:16px; height:16px; margin:-8px; border-radius:50%; left:50%; top:50%;
    background:radial-gradient(circle at 35% 30%, #f4eefc, #8a7a9a); box-shadow:0 0 10px #fff4;
    animation:lun 20s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes drift { to { transform:rotate(10deg) translateX(-8%); } }
  @keyframes pulse { 50% { opacity:.5; } }
  @keyframes lun { from { transform:rotate(0) translateX(min(32vmin,200px)); } to { transform:rotate(360deg) translateX(min(32vmin,200px)); } }
  #orb { position:absolute; left:50%; top:50%; width:68px; height:68px; transform:translate(-50%,-50%);
    border:0; border-radius:50%; cursor:pointer; z-index:4;
    background:radial-gradient(circle at 32% 28%, #fff0c4, #e0b84a 40%, #8a6a20);
    color:#1a1408; font-weight:700; letter-spacing:.08em; font-size:.7rem;
    box-shadow:0 0 26px #c9a22799; }
  #orb:active { transform:translate(-50%,-50%) scale(.94); }
  footer { flex:0 0 auto; padding:.55rem 1rem 1rem; max-width:540px; margin:0 auto; width:100%; }
  .row { display:flex; gap:8px; }
  .stat { flex:1; background:#1a1028cc; border:1px solid #2a1840; border-radius:10px; padding:.4rem; text-align:center; }
  .stat b { display:block; }
  .stat span { font-size:.58rem; color:var(--d); letter-spacing:.08em; text-transform:uppercase; }
  .bar { height:5px; background:#1a1020; border-radius:6px; overflow:hidden; margin:.4rem 0; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#4a2870,var(--g)); }
  .buys,.adv { display:flex; gap:6px; margin-top:.4rem; }
  button.buy { flex:1; text-align:left; padding:.45rem .55rem; border-radius:10px;
    border:1px solid #3a2458; background:#1a1028cc; color:var(--ink); font:inherit; cursor:pointer; }
  button.buy.go { border-color:var(--g); }
  button.buy:disabled { opacity:.35; }
  button.buy small { display:block; color:var(--d); }
  #say { min-height:3.1em; color:#d4c8e0; font-size:.82rem; margin:.4rem 0; line-height:1.4; text-align:center; }
  .adv button { flex:1; border:1px solid #3a2458; background:#140c20cc; color:var(--g);
    border-radius:999px; padding:.36rem; cursor:pointer; font-size:.74rem; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="ui">
  <header>
    <h1>WHITE WINGS</h1>
    <p class="hint">Click the sun. Tap a name on the rim. 2026 is already in the room.</p>
  </header>
  <div id="stage">
    <div id="world">
      <div class="halo"></div>
      <div class="ringline"></div>
      <div class="ringline inner"></div>
      <div class="orbit" id="o1"></div>
      <div class="orbit r" id="o2"></div>
      <div class="earth"><div class="land"></div><div class="cloud"></div><div class="shade"></div><div class="atmo"></div></div>
      <div class="moon"></div>
    </div>
    <button id="orb" type="button">CLICK</button>
  </div>
  <footer>
    <div class="row">
      <div class="stat"><span>Light</span><b id="lum">0</b></div>
      <div class="stat"><span>/ sec</span><b id="lps">0</b></div>
      <div class="stat"><span>Level</span><b id="lvl">1</b></div>
    </div>
    <div class="bar"><i id="xp"></i></div>
    <p id="say">Eight walk the rim. August 2026 — the world learned to turn in a browser.</p>
    <div class="buys">
      <button class="buy" id="bAuto" type="button"><b>Collect away</b><small>15</small></button>
      <button class="buy" id="bClick" type="button"><b>Stronger click</b><small>20</small></button>
      <button class="buy" id="bHalo" type="button"><b>Brighter halo</b><small>30</small></button>
    </div>
    <div class="adv">
      <button type="button" data-ask="hekate">Ask Hekate</button>
      <button type="button" data-ask="board">Board</button>
      <button type="button" data-ask="paimon">Paimon</button>
    </div>
  </footer>
</div>
<script>
const GODS=[
  {id:'astarte', n:'ASTARTE', o:1, a:0},
  {id:'asmodeus', n:'HEAT', o:1, a:90},
  {id:'amun', n:'AMUN', o:1, a:180},
  {id:'paimon', n:'PAIMON', o:1, a:270},
  {id:'anubis', n:'ANUBIS', o:2, a:45},
  {id:'tut', n:'TUT', o:2, a:135},
  {id:'maat', n:'MAAT', o:2, a:225},
  {id:'hekate', n:'HEKATE', o:2, a:315}
];
const LINE={
  astarte:'ASTARTE · 2026: a city is still a vow. White Wings kept one street: click, then listen.',
  asmodeus:'ASMODEUS · leftover Heat became the idle sun. Spend it or it compounds crimson.',
  amun:'AMUN-RA · the brightest 2026 move was unpublished. The public page shows only the planet.',
  anubis:'ANUBIS · we filed the desk, the bank, the cour. What died was the blob-globe. Weighed. Buried.',
  tut:'TUT · restore the spinning world. Continents as weather, not blocks. The old version returns.',
  maat:'MAAT · tilt is healthy. Perfect UI is death. Purple so we do not copy a gray site.',
  hekate:'HEKATE · 2026 hinge: play in the light, workshop in the dark. Pick the hinge, not a face.',
  paimon:'PAIMON · I announced the moon, the glove, the cour through EP10. The band is still lost. Good.',
  board:'Board · 2026: vow the street, hide the workshop, weigh the Heat, restore the spin, keep the tilt.'
};
GODS.forEach(g=>{
  const d=document.createElement('button');
  d.className='god'; d.type='button'; d.textContent=g.n;
  const r=g.o===1?48:36, rad=g.a*Math.PI/180;
  d.style.left=(50+r*Math.cos(rad))+'%';
  d.style.top=(50+r*Math.sin(rad))+'%';
  d.onclick=()=>say(LINE[g.id]);
  document.getElementById(g.o===1?'o1':'o2').appendChild(d);
});
function say(t){ document.getElementById('say').textContent=t; }
document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>say(LINE[b.dataset.ask]||LINE.board));

const c=document.getElementById('stars'),x=c.getContext('2d');
const ST=[...Array(160)].map(()=>({x:Math.random(),y:Math.random(),z:Math.random()*1.4+.2}));
function size(){ c.width=innerWidth; c.height=innerHeight; }
addEventListener('resize',size); size();
(function draw(){
  x.fillStyle='#12081c'; x.fillRect(0,0,c.width,c.height);
  ST.forEach(s=>{ s.y+=s.z*.00008; if(s.y>1)s.y=0;
    x.fillStyle=`rgba(232,220,245,${.16+s.z*.45})`;
    x.fillRect(s.x*c.width,s.y*c.height,s.z,s.z);
  });
  requestAnimationFrame(draw);
})();

function load(){ try{return JSON.parse(localStorage.getItem('ww_public')||'');}catch(e){return null;} }
const s=Object.assign({lumen:0,clicks:0,xp:0,level:1,auto:0,click:0,halo:0,t:Date.now()},load()||{});
function save(){ s.t=Date.now(); localStorage.setItem('ww_public',JSON.stringify(s)); }
function cost(b,lv){ return Math.max(1,Math.floor(b*Math.pow(1.18,lv))); }
function pow(){ return 1+s.click+s.halo*0.25; }
function lps(){ return (s.auto*0.4)*(1+s.halo*0.05); }
function need(){ return 20+s.level*15; }
function fmt(n){ return n>=1000?n.toFixed(1):Math.floor(n*10)/10; }
function render(){
  document.getElementById('lum').textContent=fmt(s.lumen);
  document.getElementById('lps').textContent=fmt(lps());
  document.getElementById('lvl').textContent=s.level;
  document.getElementById('xp').style.width=Math.min(100,s.xp/need()*100)+'%';
  [['bAuto',15,'auto'],['bClick',20,'click'],['bHalo',30,'halo']].forEach(([id,b,k])=>{
    const el=document.getElementById(id);
    el.disabled=s.lumen<cost(b,s[k]); el.classList.toggle('go',!el.disabled);
    el.querySelector('small').textContent=cost(b,s[k]);
  });
}
function addXp(n){ s.xp+=n; while(s.xp>=need()){ s.xp-=need(); s.level++; say('Level '+s.level+' · 2026 still turning.'); } }
document.getElementById('orb').onclick=()=>{ s.lumen+=pow(); s.clicks++; addXp(1); save(); render(); };
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); document.getElementById('orb').click(); }});
document.getElementById('bAuto').onclick=()=>{ const c=cost(15,s.auto); if(s.lumen<c)return; s.lumen-=c; s.auto++; save(); render(); };
document.getElementById('bClick').onclick=()=>{ const c=cost(20,s.click); if(s.lumen<c)return; s.lumen-=c; s.click++; save(); render(); };
document.getElementById('bHalo').onclick=()=>{ const c=cost(30,s.halo); if(s.lumen<c)return; s.lumen-=c; s.halo++; save(); render(); };
(function(){ const dt=Math.min(8*3600,(Date.now()-(s.t||Date.now()))/1000); const g=lps()*dt; if(g>1){ s.lumen+=g; say('While away +'+fmt(g)); }})();
setInterval(()=>{ s.lumen+=lps(); if(lps()>0) addXp(0.04); save(); render(); },1000);
render();
</script>
</body>
</html>
