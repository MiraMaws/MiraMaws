<style>

  * { box-sizing:border-box; margin:0; }
  html,body,#globe { height:100%; background:var(--bg); color:var(--ink); font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif; overflow:hidden; }
  #globe { position:fixed; inset:0; width:100%; height:100%; min-height:100dvh; }
  html,body { background:#03060d url('assets/space.jpg') center/cover no-repeat fixed; }
  #reel { position:fixed; left:50%; top:44%; width:min(70vmin,520px); height:min(70vmin,520px);

    pointer-events:none; box-shadow:0 0 60px #0af4; }
  body.globe-ok #reel { opacity:.22; filter:blur(1px); }
  #fallback {
    position:fixed; left:50%; top:44%; width:min(52vmin,320px); height:min(52vmin,320px);
    transform:translate(-50%,-50%); z-index:1; pointer-events:none;
    border-radius:50%;

    box-shadow:inset -22px -16px 36px #000c, 0 0 48px #2468aa66;

  #fallback .land { position:absolute; inset:-20%; border-radius:50%;
    background:radial-gradient(ellipse 22% 14% at 30% 40%, #2f7a4acc, transparent 70%),
               radial-gradient(ellipse 24% 16% at 64% 55%, #1f5a38bb, transparent 70%);
    animation:drift 40s linear infinite; }
  #fallback .shade { position:absolute; inset:0; border-radius:50%;
    background:linear-gradient(118deg,#fff2,transparent 36%,#0009 80%); }
  body.globe-ok #fallback { display:none; }

  #right { right:10px; display:flex; flex-direction:column; }

  .side.hideR { transform:translateX(calc(100% + 18px)); }
  .tog { position:fixed; top:12px; z-index:7; width:26px; height:26px; border-radius:2px;
    border:1px solid var(--c); background:#041018; color:var(--c); cursor:pointer; font-weight:700; }
  #tL { left:266px; }
  #tR { right:266px; }
  body.lOff #tL { left:10px; }
  body.rOff #tR { right:10px; }
  h1 { font-size:12px; letter-spacing:.22em; color:var(--c); font-weight:700; }
  .sub { color:var(--d); font-size:10px; margin:2px 0 6px; }

    font:inherit; cursor:pointer; font-size:10px; letter-spacing:.06em; text-transform:uppercase; }
  button.item.on, .mode.on { border-color:var(--c); color:var(--c); box-shadow:inset 0 0 10px #39f6ff33; }

  }

  #bar { position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:6; width:min(640px,78vw);
    padding:8px 10px 10px; background:linear-gradient(transparent,#03060dee); }

  .heat { color:#ff7a3a; }

  .pl { position:absolute; left:50%; top:44%; border-radius:50%; box-shadow:0 0 8px currentColor; }
  .pl.me { width:6px; height:6px; background:#9aa; color:#9aa; animation:orb 18s linear infinite; }
  .pl.ve { width:8px; height:8px; background:#e8c090; color:#e8c090; animation:orb 28s linear infinite reverse; }
  .pl.ma { width:7px; height:7px; background:#c44; color:#c44; animation:orb 44s linear infinite; }
  .pl.ju { width:16px; height:16px; background:#d4b07a; color:#d4b07a; animation:orb 72s linear infinite reverse; }
  .pl.sa { width:14px; height:14px; background:#e6d9a8; color:#e6d9a8; animation:orb 96s linear infinite; }
  .pl.su { width:22px; height:22px; background:radial-gradient(circle at 35% 30%,#fff6a8,#f5a020); color:#f5a020;
    animation:orb 140s linear infinite; box-shadow:0 0 24px #f5a020aa; }
  @keyframes drift { to { transform:rotate(12deg); } }
  @keyframes orb {
    from { transform:rotate(0deg) translateX(var(--r, 38vmin)) rotate(0deg); }
    to { transform:rotate(360deg) translateX(var(--r, 38vmin)) rotate(-360deg); }
  }
  .sig { position:fixed; z-index:5; width:34px; height:34px; border-radius:50%; border:1px solid #39f6ff66;
    background:#041018cc; color:var(--g); font-size:16px; cursor:pointer; display:grid; place-items:center;
    box-shadow:0 0 12px #39f6ff33; }
  .sig:hover { border-color:var(--g); transform:scale(1.1); }
  .mrow { display:flex; justify-content:space-between; font-size:10px; padding:2px 0; border-bottom:1px solid #0c2230; }
  .mrow b { color:var(--c); font-variant-numeric:tabular-nums; }
  #sync { font-size:9px; color:#4a8; margin-top:4px; }
  .arch { background:#030508; border:1px solid #111; padding:4px; max-height:18vh; overflow:auto; flex:0 0 auto; }
  .arch .ev { padding:4px; margin:3px 0; }

  @media (max-width: 820px) {

    #tR { right: 266px; }

    body.rOff #tR { right: calc(8px + env(safe-area-inset-right)); }
    #bar { width:100%; left:0; transform:none; padding:6px 8px calc(10px + env(safe-area-inset-bottom)); }
    .row { flex-wrap:wrap; }
    .stat { min-width:30%; flex:1 1 30%; }
    .buys { flex-wrap:wrap; }

    .sig { width:28px; height:28px; font-size:13px; }

function matchPlace(text){
  const t=(' '+String(text||'').toLowerCase()+' ').replace(/[^a-z0-9. ]/g,' ');
  let best=null, score=0;
  Object.keys(ALIAS).forEach(k=>{
    if(t.includes(' '+k+' ') || t.includes(k)){
      const hit=PLACES.find(p=>p.c===ALIAS[k]);
      if(hit && k.length>score){ best=hit; score=k.length; }
    }
  });
  PLACES.forEach(p=>{
    const names=[p.name,p.c].map(x=>x.toLowerCase());
    names.forEach(n=>{
      if(n.length>2 && t.includes(n.toLowerCase()) && n.length>score){ best=p; score=n.length; }
    });
  });
  return best;
}
async function locate(text){
  const hit=matchPlace(text);
  if(hit) return hit;
  try{
    const q=strip(text).split(/[,.—–-]/)[0].slice(0,80);
    const r=await fetch('https://photon.komoot.io/api/?limit=1&q='+encodeURIComponent(q));
    const j=await r.json();
    const f=j.features&&j.features[0];
    if(!f) return null;
    const [lng,lat]=f.geometry.coordinates;
    const props=f.properties||{};
    return {name:props.name||props.city||q, c:props.country||props.state||'World', lat, lng, pop:''};
  }catch(e){ return null; }
}

function ytFor(title){
  const q=encodeURIComponent(String(title||'world news')+' news');
  return {
    search:'https://www.youtube.com/results?search_query='+q,
    embed:'https://www.youtube.com/embed?listType=search&list='+q
  };
}

  f.allowFullscreen=true;
  f.style.cssText='width:100%;height:100%;border:0';
  wrap.appendChild(f);
  const a=document.getElementById('ytlink');
  a.href=y.search;
}

let livePins=[];
function paintPins(){
  if(!world) return;

function orbitPct(){
  const t=new Date();
  const start=new Date(t.getFullYear(),0,1);
  const end=new Date(t.getFullYear()+1,0,1);
  return ((t-start)/(end-start))*100;
}

function card(host, title, body, place, extra){
  const el=document.createElement('div');
  el.className='ev';
  const b=document.createElement('b'); b.textContent=title;
  const s=document.createElement('span'); s.textContent=body;
  el.appendChild(b); el.appendChild(s);
  el.onclick=()=>{
    if(place&&place.lat!=null){
      seen.add(strip(title)); seenSave();
      flyTo(place, title, extra||body);
      showVideo(title);
    } else openStory({title:strip(title).replace(/^2026 · /,''), text:extra||body, views:0});
  };
  host.appendChild(el);
}

let liveStories=[];
let newsI=0;
function strip(t){ return String(t||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }
function featPath(d){
  const y=d.getUTCFullYear();
  const m=String(d.getUTCMonth()+1).padStart(2,'0');
  const day=String(d.getUTCDate()).padStart(2,'0');
  return y+'/'+m+'/'+day;
}
function pushStory(title, text, views){
  const t=strip(title); if(!t) return;
  if(seen.has(t)) return;
  if(liveStories.some(s=>s.title===t)) return;
  liveStories.push({title:t, text:strip(text).slice(0,420), views:views||0, year:2026});
}

async function ingestFeatured(d){
  const urls=[
    'https://api.wikimedia.org/feed/v1/wikipedia/en/featured/'+featPath(d),
    'https://en.wikipedia.org/api/rest_v1/feed/featured/'+featPath(d)
  ];
  for(const u of urls){
    try{
      const feat=await fetch(u).then(r=>{ if(!r.ok) throw 0; return r.json(); });
      (feat.news||[]).forEach(story=>{
        const link=(story.links&&story.links[0])||{};
        const title=(link.titles&&(link.titles.normalized||link.titles.display))||link.title||'Story';
        pushStory(title, story.story||link.extract||'');
      });
      ((feat.mostread&&feat.mostread.articles)||[]).slice(0,10).forEach(a=>{
        const name=(a.article||(a.titles&&a.titles.normalized)||'').replace(/_/g,' ');
        if(/^(Main Page|Special:|Wikipedia:|Portal:|File:)/i.test(name)) return;
        pushStory(name, 'Trending today · '+(a.views||'')+' reads', a.views||0);
      });
      if(feat.tfa){
        const tt=(feat.tfa.titles&&feat.tfa.titles.normalized)||feat.tfa.title;
        pushStory(tt, feat.tfa.extract||'Featured today');
      }
      if(liveStories.length) return;
    }catch(e){}
  }
}

async function ingestHN(){
  try{
    const ids=(await fetch('https://hacker-news.firebaseio.com/v0/topstories.json').then(r=>r.json())).slice(0,8);
    const items=await Promise.all(ids.map(id=>fetch('https://hacker-news.firebaseio.com/v0/item/'+id+'.json').then(r=>r.json())));
    items.forEach(it=>{ if(it&&it.title) pushStory(it.title, it.title+'. Ranked live discussion.', it.score||0); });
  }catch(e){}
}

async function loadToday(){
  const n=new Date();
  const feed=document.getElementById('feed');
  const arch=document.getElementById('arch');
  feed.textContent='Loading today…';
  await ingestFeatured(n);
  if(!liveStories.length){
    const y=new Date(n); y.setUTCDate(y.getUTCDate()-1);
    await ingestFeatured(y);
  }
  await ingestHN();
  try{
    const r=await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${n.getUTCMonth()+1}/${n.getUTCDate()}`);
    const j=await r.json();
    const ev=j.events||[];
    arch.innerHTML='';
    ev.filter(e=>+e.year<2026).slice(0,6).forEach(e=>{
      const place=matchPlace(e.text);
      card(arch, e.year+' · '+place.c, String(e.text||'').slice(0,110), place, String(e.text||'').slice(0,160));
    });
  }catch(e){}
  feed.innerHTML='';
  if(!liveStories.length){
    feed.textContent='';
    const empty=document.createElement('div'); empty.className='ev';
    empty.appendChild(Object.assign(document.createElement('b'),{textContent:'No live pack'}));
    empty.appendChild(Object.assign(document.createElement('span'),{textContent:'Public feeds blinked. Try TODAY again.'}));
    feed.appendChild(empty);
    document.getElementById('evSub').textContent='Today · '+n.toDateString();
    return [];
  }
  liveStories.sort((a,b)=>(b.views||0)-(a.views||0));
  newsI=0;
  liveStories.filter(s=>!seen.has(s.title)).forEach(s=>{
    const place=matchPlace(s.title+' '+s.text);
    card(feed, '2026 · '+s.title, s.text, place, s.text);
  });
  document.getElementById('evSub').textContent='Live today · '+liveStories.length+' stories · '+n.toDateString();
  return liveStories;
}

async function syncEarth(){
  document.getElementById('mOrb').textContent=orbitPct().toFixed(3)+'%';
  try{
    const [eq, eo, co2, tmp]=await Promise.allSettled([
      fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson').then(r=>r.json()),
      fetch('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=12').then(r=>r.json()),
      fetch('https://global-warming.org/api/co2-api').then(r=>r.json()),
      fetch('https://global-warming.org/api/temperature-api').then(r=>r.json())
    ]);
    livePins=[];
    if(eq.status==='fulfilled'){
      const feats=(eq.value.features||[]).slice(0,20);
      document.getElementById('mQ').textContent=String(feats.length);
      feats.forEach(f=>{
        const c=f.geometry&&f.geometry.coordinates;
        if(!c) return;
        livePins.push({name:(f.properties&&f.properties.place)||'quake', c:'USGS', lat:c[1], lng:c[0], pop:'M'+(f.properties&&f.properties.mag), kind:'quake'});
      });
      const feed=document.getElementById('feed');
      feats.slice(0,4).forEach(f=>{
        const c=f.geometry.coordinates;
        const p={name:f.properties.place, c:'Quake', lat:c[1], lng:c[0], pop:'M'+f.properties.mag};
        card(feed, '2026 · USGS M'+f.properties.mag, f.properties.place, p, 'Public earthquake feed.');
      });
    } else document.getElementById('mQ').textContent='—';
    if(eo.status==='fulfilled'){
      (eo.value.events||[]).slice(0,8).forEach(ev=>{
        const g=ev.geometry&&ev.geometry[ev.geometry.length-1];
        if(!g||!g.coordinates) return;
        const [lng,lat]=g.coordinates;
        const fire=/fire|wildfire/i.test(ev.categories&&ev.categories[0]&&ev.categories[0].title||'');
        livePins.push({name:ev.title, c:'EONET', lat, lng, pop:ev.categories[0]&&ev.categories[0].title, kind:fire?'fire':'quake'});
      });
    }
    if(co2.status==='fulfilled' && co2.value.co2&&co2.value.co2.length){
      document.getElementById('mCo2').textContent=parseFloat(co2.value.co2[co2.value.co2.length-1].trend).toFixed(2)+' ppm';
    } else document.getElementById('mCo2').textContent='n/a';
    if(tmp.status==='fulfilled' && tmp.value.result&&tmp.value.result.length){
      const last=tmp.value.result[tmp.value.result.length-1];
      const v=parseFloat(last.land||last.station||0);
      document.getElementById('mTemp').textContent=(v>=0?'+':'')+v.toFixed(2)+'°';
    } else if(tmp.status==='fulfilled' && tmp.value.temperature&&tmp.value.temperature.length){
      const v=parseFloat(tmp.value.temperature[tmp.value.temperature.length-1].land);
      document.getElementById('mTemp').textContent=(v>=0?'+':'')+v.toFixed(2)+'°';
    } else document.getElementById('mTemp').textContent='n/a';
    paintPins();
    document.getElementById('sync').textContent='sync '+new Date().toLocaleTimeString()+' · USGS · EONET · wiki';
  }catch(e){
    document.getElementById('sync').textContent='sync partial';
    paintPins();
  }
}

function drawSpark(){
  const svg=document.getElementById('spark'); if(!svg) return;
  const t=new Date(), doy=Math.floor((t-new Date(t.getFullYear(),0,0))/86400000);
  const pts=[];
  for(let i=0;i<5;i++){
    const day=doy- (4-i)*30;
    const seas=Math.sin((day-120)*2*Math.PI/365.25);
    pts.push(425.4+seas*2.85);
  }
  const mn=Math.min(...pts)-0.4, mx=Math.max(...pts)+0.4;
  const w=220,h=56;
  const d=pts.map((v,i)=>{
    const x=(i/4)*w, y=h-8-((v-mn)/(mx-mn))*(h-16);
    return x+','+y;
  }).join(' ');
  svg.innerHTML='<polyline fill="none" stroke="#c9a227" stroke-width="1.6" points="'+d+'"/>';
}
drawSpark();

const POP0=8231000000, T0=Date.UTC(2026,0,1), PPS=2.15;
function worldPop(){ return Math.floor(POP0+Math.max(0,(Date.now()-T0)/1000)*PPS); }
function popStr(n){ return n.toLocaleString('en-US'); }
function utcStr(){
  const d=new Date();
  return d.toISOString().slice(11,19)+' UTC';
}
async function pullHeat(p){
  const lat=(p&&p.lat!=null)?p.lat:30.04, lng=(p&&p.lng!=null)?p.lng:31.24;
  try{
    const j=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&current=temperature_2m').then(r=>r.json());
    const t=j.current&&j.current.temperature_2m;
    if(t==null) return;
    document.getElementById('heatN').textContent=t+'°';
  }catch(e){}
}
function paintNews(){
  const now=liveStories.length?liveStories[(Math.max(0,newsI-1))%liveStories.length]:null;
  const nxt=liveStories.length?liveStories[newsI%liveStories.length]:null;
  const cut=t=>String(t||'—').slice(0,22);
  document.getElementById('nowN').textContent=cut(now&&now.title||lastEvent.title);
  document.getElementById('nextN').textContent=cut(nxt&&nxt.title);
  document.getElementById('popN').textContent=popStr(worldPop());
  document.getElementById('timeN').textContent=utcStr();
}
async function openStory(st){
  if(!st){ say('Caught up. New headlines arrive every minute.'); return; }
  seen.add(st.title); seenSave();
  const place=await locate(st.title+' '+st.text);
  if(!place){ say('No location found for that story.'); return; }
  flyTo(place, st.title, st.text);
  showVideo(st.title);
}
function nextFresh(){ return liveStories.find(s=>!seen.has(s.title))||null; }
function showStory(){ return openStory(nextFresh()); }

if(window.matchMedia && matchMedia('(max-width:820px)').matches){

setInterval(()=>{ loadToday().then(()=>{ paintNews(); return syncEarth(); }); }, 60000);
