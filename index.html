<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>White Wings</title>
<style>
  :root { --g:#c9a227; --ink:#ece6dc; --d:#8a8490; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:#07070b; color:var(--ink); font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; }
  #ui { position:relative; z-index:2; height:100%; display:grid; grid-template-rows:auto 1fr auto; }
  header { text-align:center; padding:1.2rem 1rem .4rem; }
  h1 { font-weight:500; letter-spacing:.42em; font-size:.78rem; color:var(--g); }
  .hint { color:var(--d); font-size:.88rem; margin-top:.45rem; }
  #stage { position:relative; }
  #world { position:absolute; left:50%; top:46%; width:min(52vmin,340px); height:min(52vmin,340px);
    margin:calc(min(26vmin,170px)*-1) 0 0 calc(min(26vmin,170px)*-1); }
  .orbit { position:absolute; inset:0; border-radius:50%; animation:spin 42s linear infinite; }
  .orbit.r { animation-duration:64s; animation-direction:reverse; }
  .god { position:absolute; width:34px; height:34px; margin:-17px; border-radius:50%;
    background:#14141c; border:1px solid var(--g); color:var(--g); font-size:9px; letter-spacing:.04em;
    display:grid; place-items:center; cursor:pointer; text-align:center; line-height:1.05; }
  .god:hover { background:#1c1810; transform:scale(1.08); }
  .earth { position:absolute; inset:22%; border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 32% 28%, #9ad0ff, #1a4a8a 46%, #071828);
    box-shadow:inset -18px -12px 28px #0007, 0 0 40px #3af3; }
  .land { position:absolute; inset:-25%; opacity:.8;
    background:repeating-linear-gradient(118deg, transparent 0 16px, #2f7a4a77 16px 30px, transparent 30px 48px);
    animation:drift 28s linear infinite; }
  .cloud { position:absolute; inset:0;
    background:radial-gradient(circle at 22% 30%, #fff5, transparent 20%),
               radial-gradient(circle at 70% 62%, #fff3, transparent 16%);
    animation:drift 40s linear infinite reverse; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes drift { to { transform:translateX(-16%); } }
  #orb { position:absolute; left:50%; top:46%; width:78px; height:78px; margin:-39px 0 0 -39px;
    border:0; border-radius:50%; cursor:pointer; z-index:3;
    background:radial-gradient(circle at 35% 30%, #f2e2a8, #8a6a20 55%, #1a1408);
    color:#1a1408; font-weight:700; letter-spacing:.08em; box-shadow:0 0 24px #c9a22777; }
  #orb:active { transform:scale(.94); }
  footer { padding:.6rem 1rem 1.1rem; max-width:560px; margin:0 auto; width:100%; }
  .row { display:flex; gap:8px; }
  .stat { flex:1; background:#101016cc; border-radius:10px; padding:.45rem; text-align:center; }
  .stat b { display:block; font-size:1.05rem; }
  .stat span { font-size:.62rem; color:var(--d); text-transform:uppercase; }
  .bar { height:5px; background:#111; border-radius:6px; overflow:hidden; margin:.45rem 0 .55rem; }
  .bar i { display:block; height:100%; width:0; background:var(--g); }
  .buys { display:flex; gap:8px; }
  button.buy { flex:1; text-align:left; padding:.55rem .7rem; border-radius:10px;
    border:1px solid #2a2430; background:#101016cc; color:var(--ink); font:inherit; cursor:pointer; }
  button.buy.go { border-color:var(--g); }
  button.buy:disabled { opacity:.35; }
  button.buy small { display:block; color:var(--d); }
  #say { min-height:3.2em; color:#c4b8c8; font-size:.86rem; margin:.55rem 0; line-height:1.4; }
  .adv { display:flex; gap:6px; flex-wrap:wrap; margin-top:.35rem; }
  .adv button { flex:1; min-width:90px; border:1px solid #2a2430; background:#0c0c12cc; color:var(--g);
    border-radius:999px; padding:.4rem .55rem; cursor:pointer; font-size:.78rem; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="ui">
  <header>
    <h1>WHITE WINGS</h1>
    <p class="hint">Click the sun. Tap a name in orbit to ask them. Buttons light up when you can buy.</p>
  </header>
  <div id="stage">
    <div id="world">
      <div class="orbit" id="o1"></div>
      <div class="orbit r" id="o2"></div>
      <div class="earth"><div class="land"></div><div class="cloud"></div></div>
    </div>
    <button id="orb" type="button">CLICK</button>
  </div>
  <footer>
    <div class="row">
      <div class="stat"><span>Light</span><b id="lum">0</b></div>
      <div class="stat"><span>/ sec</span><b id="lps">0</b></div>
      <div class="stat"><span>Level</span><b id="lvl">1</b></div>
    </div>
    <div class="bar"><i id="xp"></i></div>
    <p id="say">They are already walking the rim.</p>
    <div class="buys">
      <button class="buy" id="bAuto" type="button"><b>Collect away</b><small>15</small></button>
      <button class="buy" id="bClick" type="button"><b>Stronger click</b><small>20</small></button>
    </div>
    <div class="adv">
      <button type="button" data-ask="hekate">Ask Hekate</button>
      <button type="button" data-ask="board">Board</button>
      <button type="button" data-ask="paimon">Paimon</button>
    </div>
  </footer>
</div>
<script>
const GODS=[
  {id:'astarte', n:'ASTARTE', orbit:1, a:20, ask:'A city is a vow with streets.'},
  {id:'asmodeus', n:'ASMODEUS', orbit:1, a:80, ask:'Name the leftover heat.'},
  {id:'amun', n:'AMUN-RA', orbit:1, a:140, ask:'The brightest move is unpublished.'},
  {id:'anubis', n:'ANUBIS', orbit:2, a:10, ask:'What died — did we weigh it?'},
  {id:'tut', n:'TUT', orbit:2, a:70, ask:'Restore one buried name.'},
  {id:'maat', n:'MAAT', orbit:2, a:130, ask:'Keep a slight tilt. Perfect balance is death.'},
  {id:'hekate', n:'HEKATE', orbit:2, a:190, ask:'Pick the hinge, not a face.'},
  {id:'paimon', n:'PAIMON', orbit:1, a:200, ask:'I announced it. The band is lost. That’s the map.'}
];
function place(){
  GODS.forEach(g=>{
    const host=document.getElementById(g.orbit===1?'o1':'o2');
    const d=document.createElement('button');
    d.className='god'; d.type='button'; d.textContent=g.n.replace('-','\n');
    const r=48, rad=g.a*Math.PI/180;
    d.style.left=(50+r*Math.cos(rad))+'%';
    d.style.top=(50+r*Math.sin(rad))+'%';
    d.onclick=()=>useGod(g);
    host.appendChild(d);
  });
}
place();
const sayEl=document.getElementById('say');
function say(t){ sayEl.textContent=t; }

async function wikiOnThisDay(){
  const now=new Date();
  const u=`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${now.getUTCMonth()+1}/${now.getUTCDate()}`;
  const r=await fetch(u);
  const j=await r.json();
  const ev=(j.events||[])[Math.floor(Math.random()*(j.events||[]).length)];
  return ev ? (ev.year+': '+(ev.text||'').slice(0,180)) : 'The archive is quiet.';
}
async function wikiRandom(){
  const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary');
  const j=await r.json();
  return (j.title||'Untitled')+' — '+String(j.extract||'').slice(0,160);
}
async function weather(){
  const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=30.04&longitude=31.24&current=temperature_2m');
  const j=await r.json();
  const t=j.current && j.current.temperature_2m;
  return 'Open heat at the old river: '+t+'°. Spend it or it becomes a private hell.';
}
async function news(){
  const r=await fetch('https://en.wikipedia.org/api/rest_v1/feed/featured/'+new Date().toISOString().slice(0,10).replace(/-/g,'/'));
  const j=await r.json();
  const t=(j.tfa && (j.tfa.titles&&j.tfa.titles.normalized || j.tfa.title)) || 'Today';
  const x=j.tfa && j.tfa.extract ? String(j.tfa.extract).slice(0,150) : 'A featured page is waiting.';
  return t+' — '+x;
}

async function useGod(g){
  say(g.n+' listens…');
  try{
    let line=g.ask;
    if(g.id==='anubis') line='ANUBIS files: '+(await news());
    else if(g.id==='tut') line='TUT restores: '+(await wikiOnThisDay());
    else if(g.id==='amun') line='AMUN-RA hides in: '+(await wikiRandom());
    else if(g.id==='asmodeus') line='ASMODEUS: '+(await weather());
    else if(g.id==='astarte') line='ASTARTE: a city is a vow. '+(await wikiRandom());
    else if(g.id==='maat') line='MAAT weighs: '+(await wikiOnThisDay());
    else if(g.id==='hekate') line='HEKATE at the hinge: '+(await wikiRandom());
    else if(g.id==='paimon') line='PAIMON (too loud): '+(await news());
    say(line);
  }catch(e){ say(g.n+': the net blinked. '+g.ask); }
}
document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.ask;
  const g=GODS.find(x=>x.id===(id==='board'?'maat':id)) || GODS[0];
  if(id==='board'){
    say('Board — ASTARTE: vow. ASMODEUS: heat. AMUN-RA: hide. ANUBIS: weigh. TUT: restore. MAAT: tilt.');
    return;
  }
  useGod(g);
});

const c=document.getElementById('stars'),x=c.getContext('2d');
function size(){ c.width=innerWidth; c.height=innerHeight; }
addEventListener('resize',size); size();
const stars=[...Array(140)].map(()=>({x:Math.random(),y:Math.random(),z:Math.random()*1.4+.2}));
(function draw(){
  x.fillStyle='#07070b'; x.fillRect(0,0,c.width,c.height);
  stars.forEach(s=>{ s.y+=s.z*.00012; if(s.y>1)s.y=0;
    x.fillStyle=`rgba(232,228,220,${.2+s.z*.45})`;
    x.fillRect(s.x*c.width,s.y*c.height,s.z,s.z);
  });
  requestAnimationFrame(draw);
})();

function load(){ try{return JSON.parse(localStorage.getItem('ww_public')||'');}catch(e){return null;} }
const s=Object.assign({lumen:0,clicks:0,xp:0,level:1,auto:0,click:0,t:Date.now()},load()||{});
function save(){ s.t=Date.now(); localStorage.setItem('ww_public',JSON.stringify(s)); }
function cost(b,lv){ return Math.max(1,Math.floor(b*Math.pow(1.18,lv))); }
function pow(){ return 1+s.click; }
function lps(){ return s.auto*0.4; }
function need(){ return 20+s.level*15; }
function fmt(n){ return n>=1000?n.toFixed(1):Math.floor(n*10)/10; }
function render(){
  document.getElementById('lum').textContent=fmt(s.lumen);
  document.getElementById('lps').textContent=fmt(lps());
  document.getElementById('lvl').textContent=s.level;
  document.getElementById('xp').style.width=Math.min(100,s.xp/need()*100)+'%';
  const a=document.getElementById('bAuto'), k=document.getElementById('bClick');
  a.disabled=s.lumen<cost(15,s.auto); k.disabled=s.lumen<cost(20,s.click);
  a.classList.toggle('go',!a.disabled); k.classList.toggle('go',!k.disabled);
  a.querySelector('small').textContent=cost(15,s.auto);
  k.querySelector('small').textContent=cost(20,s.click);
}
function addXp(n){ s.xp+=n; while(s.xp>=need()){ s.xp-=need(); s.level++; say('Level '+s.level); } }
document.getElementById('orb').onclick=()=>{ s.lumen+=pow(); s.clicks++; addXp(1); save(); render(); };
document.getElementById('bAuto').onclick=()=>{ const c=cost(15,s.auto); if(s.lumen<c)return; s.lumen-=c; s.auto++; save(); render(); };
document.getElementById('bClick').onclick=()=>{ const c=cost(20,s.click); if(s.lumen<c)return; s.lumen-=c; s.click++; save(); render(); };
(function(){ const dt=Math.min(8*3600,(Date.now()-(s.t||Date.now()))/1000); const g=lps()*dt; if(g>1){ s.lumen+=g; say('While away +'+fmt(g)); }})();
setInterval(()=>{ s.lumen+=lps(); if(lps()>0) addXp(0.04); save(); render(); },1000);
render();
</script>
</body>
</html>
